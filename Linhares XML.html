<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linhares XML</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
:root{--g:#d69a52;--gd:#9a6020;--bg:#f4f5fa;--c:#fff;--t:#1a2340;--m:#5f6b85;--l:#e1e5ef;--in:#e8effc;--er:#b3261e;--wa:#9a6700;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--gd:#d69a52;--bg:#0e1424;--c:#161e33;--t:#e8ecf6;--m:#9aa5c0;--l:#27304a;--in:#1c2744;--er:#ff8a80;--wa:#e3b341;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;display:flex;min-height:100vh;background:var(--bg);color:var(--t);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
aside{flex:0 0 42%;max-width:560px;position:sticky;top:0;height:100vh;overflow:hidden;color:#fff;padding:44px;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 0 0,#1a3578 0,#081337 55%,#050d2a)}
.lg{display:flex;align-items:center;gap:12px}.lg img{height:42px}.lg b{display:block;font:600 21px Outfit,sans-serif;color:var(--g)}.lg small{font-size:10px;letter-spacing:.2em;color:#8fa0d0}
.wm{position:absolute;right:-110px;top:150px;width:430px;opacity:.07;pointer-events:none}
.hd{margin:auto 0;position:relative}h1{font:600 32px/1.22 Outfit,sans-serif;margin:0 0 18px}h1 span{color:var(--g)}
ul{list-style:none;margin:0;padding:0}li{margin:9px 0;color:#dbe3f7}li:before{content:"\2713";color:var(--g);font-weight:600;margin-right:10px}
.ft{font-size:13px;color:#b9c4e4;position:relative}
main{flex:1;padding:48px 28px;display:flex;justify-content:center;align-items:flex-start;min-width:0}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;box-shadow:0 8px 30px rgba(13,28,72,.08);padding:26px;width:100%;max-width:780px}
h2{font:600 21px Outfit,sans-serif;margin:0}.sub{margin:2px 0 16px;color:var(--m);font-size:14px}
#dz{border:1.5px dashed var(--g);border-radius:10px;background:var(--in);padding:26px 16px;text-align:center;cursor:pointer}
#dz.on{background:var(--l)}#dz b{font-size:16px}#dz p{margin:4px 0 0;color:var(--m);font-size:14px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.st div{background:var(--bg);border:1px solid var(--l);border-radius:8px;padding:9px 12px}.st b{display:block;font:600 24px Outfit,sans-serif}.st span{color:var(--m);font-size:13px}
.ac{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;border:0;background:linear-gradient(100deg,#c98c45,#f3c88a);color:#1a1204;font-weight:600;border-radius:9px;padding:11px 20px;cursor:pointer}
button.s{background:none;border:1px solid var(--l);color:var(--gd);font-weight:400;padding:4px 12px}button:disabled{opacity:.4;cursor:default}button:focus-visible,#dz:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
#pg{color:var(--m);min-height:22px;margin-bottom:8px}
.tb{overflow-x:auto;border:1px solid var(--l);border-radius:8px}
table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--l);font-size:14px}th{color:var(--m);font-weight:600}
.e{color:var(--er)}.w{color:var(--wa)}.note{color:var(--m);font-size:13px;margin:14px 0 0}
@media(max-width:860px){body{flex-direction:column}aside{position:static;height:auto;max-width:none;flex:none;padding:22px}.hd{margin:18px 0 0}h1{font-size:24px;margin:0}ul,.ft,.wm{display:none}main{padding:18px 12px}.card{padding:18px}}
</style></head><body>

$('tb').onclick=e=>{const i=e.target.dataset.i;if(i!=null){const n=N[i];dl(n.blob,nm(n))}};
$('bz').onclick=async()=>{$('pg').textContent='Gerando ZIP…';const z=new JSZip();N.forEach(n=>z.file(nm(n),n.blob));dl(await z.generateAsync({type:'blob',compression:'STORE'}),'DANFEs_Linhares.zip');$('pg').textContent='ZIP gerado.'};
$('bu').onclick=async()=>{$('pg').textContent='Gerando PDF único…';let doc=null,k=0;for(const n of N){doc=mk(n,doc);if(++k%10==0)await tick()}dl(doc.output('blob'),'DANFEs_Linhares.pdf');$('pg').textContent='PDF único gerado.'};
$('bl').onclick=()=>{N=[];K=new Set();R=[];D=0;TOT=0;$('pg').textContent='';draw()};
</script></body></html>
